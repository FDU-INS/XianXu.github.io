{% if page.lang == 'en' %}
  {% assign back_to_top_label = 'Back to top' %}
{% else %}
  {% assign back_to_top_label = '返回顶部' %}
{% endif %}
<button id="back-to-top" class="back-to-top" type="button" aria-label="{{ back_to_top_label }}" title="{{ back_to_top_label }}" hidden>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M6 12l6-6 6 6M12 6v13" />
  </svg>
</button>
<script src="{{ '/assets/js/back-to-top.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
